[project]
name = "mosaic"
version = "0.1.0"
description = "Mosaic worker: data sources, sync, perception, analytics, agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "langfuse>=2.50",
    "modal>=0.64",
    "numpy>=2.5.4",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "scenedetect[opencv-headless]>=0.6.4",
    "scipy>=1.18.1",
    "supabase>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# prompts and tool descriptions are long natural-language strings
"src/mosaic/agents/*.py" = ["E501"]
"tests/test_strategist.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
