[project]
name = "mosaic"
version = "0.1.0"
description = "Mosaic worker: data sources, sync, perception, analytics, agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "modal>=0.64",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "supabase>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
